<!DOCTYPE html>
<html lang="uk">
    
<head>
    
    <script>
        // Применяем класс сразу при загрузке DOM, чтобы избежать вспышки белого цвета
        if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-theme'); // Добавляем к <html> или <body>
        }
</script>
    
    <meta charset="UTF-8">
    <title> Настройкі </title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header>
    
    <a href="index.html">Home</a>
    
    </header>

    <main>
        
        <button id="theme-toggle">🌙 Темна тема</button>
        
    </main>
    
<script src="script.js"></script>
    
</body>   
</html>
