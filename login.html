<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        // Миттєво перевіряємо і додаємо клас темної теми на весь документ ще до малювання сторінки
        const isDark = localStorage.getItem('theme') === 'dark' || 
                       localStorage.getItem('darkTheme') === 'true' || 
                       localStorage.getItem('isDark') === 'true';
        if (isDark) {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Вхід - ClickSword</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        /* Підтримка темної теми через загальний клас на html або body */
        html.dark-theme body,
        body.dark-theme {
            background-color: #121212;
            color: #f1f1f1;
        }
        .settings-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        .settings-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
            align-items: center;
            transition: background 0.3s, box-shadow 0.3s;
        }
        html.dark-theme .settings-card,
        body.dark-theme .settings-card {
            background: #1e1e1e;
            box-shadow: 0 4px 15px rgba(255,255,255,0.05);
        }
        .settings-card input {
            padding: 12px;
            width: 85%;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 16px;
            background: #fff;
            color: #333;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        html.dark-theme .settings-card input,
        body.dark-theme .settings-card input {
            background: #2d2d2d;
            border: 2px solid #444;
            color: #fff;
        }
        .settings-card button {
            padding: 12px 24px;
            background: cyan;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 95%;
            transition: background 0.3s;
        }
        html.dark-theme .settings-card button,
        body.dark-theme .settings-card button {
            background: #03dac6;
            color: #121212;
        }
        header {
            padding: 20px;
        }
        .home-btn {
            font-size: 24px;
            text-decoration: none;
        }
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #00838f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: bottom 0.3s ease-in-out;
            z-index: 1000;
        }
        html.dark-theme .toast,
        body.dark-theme .toast {
            background: #bb86fc;
            color: #121212;
        }
        .toast.show {
            bottom: 30px; 
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>

    <div id="toast" class="toast">Повідомлення</div>

    <main class="settings-container">
        <h1>🔑 Вхід в акаунт</h1>
        <form id="loginForm" class="settings-card">
            <input type="text" id="loginUser" placeholder="Введіть логін" required>
            <input type="password" id="loginPass" placeholder="Введіть пароль" required>
            <button type="submit" id="submitLogin">Увійти</button>
        </form>
    </main>

<script>
    // Гарантовано додаємо клас і до body при завантаженні скрипта
    if (isDark) {
        document.body.classList.add('dark-theme');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value.trim();

        let usersData = JSON.parse(localStorage.getItem('gameUsersData')) || {};
        console.log("Всі зареєстровані користувачі:", usersData);

        if (!usersData[username]) {
            showToast('❌ Такого користувача не існує!');
            return;
        }

        let storedPassword = typeof usersData[username] === 'object' ? usersData[username].password : usersData[username];

        if (storedPassword === password) {
            localStorage.setItem('currentUser', username);
            showToast('✨ Успішний вхід!');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        } else {
            showToast('❌ Неправильний пароль!');
        }
    });
</script>
</body>
</html>
