<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title> Магазин </title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <a href="index.html">Home</a>
    </header>
    
    <main>
        <!-- Виводимо баланс очок у магазині -->
        <h2>Ваші очки: <span id="shop-counter">0</span></h2>
        
        <div class="shop">
            <div class="upgrade1">  
                <button class="up1" id="up1">Клік +1 | Ціна: <span class="cost">100</span> | Куплено: <span class="count">0</span></button>  
                <button class="up2" id="up2">Клік +2 | Ціна: <span class="cost">250</span> | Куплено: <span class="count">0</span></button>
            </div>
            <div class="upgrade1">  
                <button class="up1" id="up3">Клік +5 | Ціна: <span class="cost">500</span> | Куплено: <span class="count">0</span></button>  
                <button class="up2" id="up4">Клік +10 | Ціна: <span class="cost">1500</span> | Куплено: <span class="count">0</span></button>
            </div>
            <div class="upgrade1">  
                <button class="up1" id="up5">Клік +15 | Ціна: <span class="cost">2000</span> | Куплено: <span class="count">0</span></button>  
                <button class="up2" id="up6">Клік +20 | Ціна: <span class="cost">3000</span> | Куплено: <span class="count">0</span></button>
            </div>
            <div class="upgrade1">  
                <button class="up1" id="up7">Клік +50 | Ціна: <span class="cost">50000</span> | Куплено: <span class="count">0</span></button>  
                <button class="up2" id="up8">Клік +100 | Ціна: <span class="cost">150000</span> | Куплено: <span class="count">0</span></button>
            </div>
        </div>
    </main>
    
<script src="script2.js"></script>
</body>
</html>
