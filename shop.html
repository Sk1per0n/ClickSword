<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Магазин - ClickSword</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>
    
    <main class="shop-container">
        <!-- Красиве спливаюче сповіщення замість alert -->
        <div id="toast" class="toast">Покупка успішна!</div>

        <h1>🛒 Магазин покращень</h1>
        <div class="balance-card">
            <h2>Ваші очки: <span id="shop-counter">0</span></h2>
        </div>
        
        <div class="shop-grid">
            <button class="shop-card" id="up1">
                <div class="upgrade-title">Клік +1</div>
                <div class="upgrade-info">Ціна: <span class="cost">100</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>
            
            <button class="shop-card" id="up2">
                <div class="upgrade-title">Клік +2</div>
                <div class="upgrade-info">Ціна: <span class="cost">250</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up3">
                <div class="upgrade-title">Клік +5</div>
                <div class="upgrade-info">Ціна: <span class="cost">500</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up4">
                <div class="upgrade-title">Клік +10</div>
                <div class="upgrade-info">Ціна: <span class="cost">1500</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up5">
                <div class="upgrade-title">Клік +15</div>
                <div class="upgrade-info">Ціна: <span class="cost">2000</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up6">
                <div class="upgrade-title">Клік +20</div>
                <div class="upgrade-info">Ціна: <span class="cost">3000</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up7">
                <div class="upgrade-title">Клік +50</div>
                <div class="upgrade-info">Ціна: <span class="cost">50000</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>

            <button class="shop-card" id="up8">
                <div class="upgrade-title">Клік +100</div>
                <div class="upgrade-info">Ціна: <span class="cost">150000</span></div>
                <div class="upgrade-count">Куплено: <span class="count">0</span></div>
            </button>
        </div>
    </main>
    
<script src="script2.js"></script>
</body>
</html>
