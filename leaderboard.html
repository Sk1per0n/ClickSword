<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Лідерборд - ClickSword</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>

    <main class="shop-container">
        <h1>🏆 Таблиця лідерів</h1>
        <p class="subtitle">Найкращі гравці за загальною кількістю кліків</p>
        
        <div class="leaderboard-list" id="leaderboardContainer">
            <!-- Тут будуть з'являтися гравці -->
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('leaderboardContainer');
        
        let usersData = JSON.parse(localStorage.getItem('gameUsersData')) || {};
        let sortedUsers = [];

        if (Object.keys(usersData).length > 0) {
            sortedUsers = Object.entries(usersData).map(([username, data]) => {
                let totalClicks = localStorage.getItem('totalClicks_' + username);
                let score = totalClicks !== null ? parseInt(totalClicks) : (data.score || 0);
                return [username, score];
            });
        } else {
            let legacyUsers = JSON.parse(localStorage.getItem('gameUsers')) || {};
            sortedUsers = Object.entries(legacyUsers);
        }

        sortedUsers.sort((a, b) => b[1] - a[1]);

        if (sortedUsers.length === 0) {
            container.innerHTML = '<p class="empty-text">Поки що немає зареєстрованих гравців.</p>';
            return;
        }

        sortedUsers.forEach(([username, score], index) => {
            const item = document.createElement('div');
            item.className = 'leader-item';
            
            // Додаємо особливі іконки для топ-3 гравців
            let medal = `#${index + 1}`;
            if (index === 0) medal = '🥇';
            if (index === 1) medal = '🥈';
            if (index === 2) medal = '🥉';

            item.innerHTML = `
                <div class="leader-user"><span class="medal">${medal}</span> ${username}</div> 
                <div class="leader-score">${score} клік</div>
            `;
            container.appendChild(item);
        });
    });
</script>
</body>
</html>
