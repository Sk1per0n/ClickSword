<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        const isDark = localStorage.getItem('theme') === 'dark' || 
                       localStorage.getItem('darkTheme') === 'true' || 
                       localStorage.getItem('isDark') === 'true';
        if (isDark) {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Таблиця лідерів - ClickSword</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        html.dark-theme body,
        body.dark-theme {
            background-color: #121212;
            color: #f1f1f1;
        }
        header {
            padding: 20px;
        }
        .home-btn {
            font-size: 24px;
            text-decoration: none;
        }
        .leaderboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .leaderboard-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        html.dark-theme .leaderboard-card,
        body.dark-theme .leaderboard-card {
            background: #1e1e1e;
            box-shadow: 0 4px 15px rgba(255,255,255,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        html.dark-theme th, html.dark-theme td,
        body.dark-theme th, body.dark-theme td {
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
        html.dark-theme th,
        body.dark-theme th {
            background-color: #252525;
            color: #fff;
        }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
        html.dark-theme .no-data,
        body.dark-theme .no-data {
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>

    <main class="leaderboard-container">
        <h1>🏆 Таблиця лідерів</h1>
        <div class="leaderboard-card">
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Місце</th>
                        <th>Гравець</th>
                        <th>Рахунок</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Заповнюється автоматично -->
                </tbody>
            </table>
        </div>
    </main>

<script>
    if (isDark) {
        document.body.classList.add('dark-theme');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const tbody = document.getElementById('leaderboardBody');
        let usersData = JSON.parse(localStorage.getItem('gameUsersData')) || {};
        
        let usersArray = Object.keys(usersData).map(username => {
            let score = 0;
            
            // 1. Спочатку перевіряємо персональний лічильник гравця (де зберігаються поточні кліки)
            let specificCounter = localStorage.getItem('userCounter_' + username);
            if (specificCounter !== null) {
                score = parseInt(specificCounter, 10);
            } else {
                // 2. Якщо його немає, беремо з бази даних
                let userData = usersData[username];
                if (typeof userData === 'object' && userData !== null) {
                    score = userData.score !== undefined ? userData.score : (userData.points || 0);
                } else if (typeof userData === 'number') {
                    score = userData;
                }
            }
            
            return { username: username, score: score };
        });

        // Сортуємо за спаданням рахунку
        usersArray.sort((a, b) => b.score - a.score);

        if (usersArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="no-data">Ще немає зареєстрованих гравців!</td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        usersArray.forEach((user, index) => {
            let medal = '';
            if (index === 0) medal = '🥇 ';
            else if (index === 1) medal = '🥈 ';
            else if (index === 2) medal = '🥉 ';
            else medal = (index + 1) + '. ';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${medal}</td>
                <td>${user.username}</td>
                <td>${user.score}</td>
            `;
            tbody.appendChild(row);
        });
    });
</script>
</body>
</html>
