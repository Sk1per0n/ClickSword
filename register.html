<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Реєстрація - ClickSword</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        /* Стилі для темної теми на сторінці реєстрації/входу */
        body {
            background-color: #f4f4f9;
            color: #333;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-theme {
            background-color: #121212;
            color: #f1f1f1;
        }
        .settings-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        .settings-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
            align-items: center;
            transition: background 0.3s, box-shadow 0.3s;
        }
        body.dark-theme .settings-card {
            background: #1e1e1e;
            box-shadow: 0 4px 15px rgba(255,255,255,0.05);
        }
        .settings-card input {
            padding: 12px;
            width: 85%;
            border-radius: 8px;
            border: 2px solid #ccc;
            font-size: 16px;
            background: #fff;
            color: #333;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        body.dark-theme .settings-card input {
            background: #2d2d2d;
            border: 2px solid #444;
            color: #fff;
        }
        .settings-card button {
            padding: 12px 24px;
            background: cyan;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 95%;
            transition: background 0.3s;
        }
        body.dark-theme .settings-card button {
            background: #03dac6;
            color: #121212;
        }
        header {
            padding: 20px;
        }
        .home-btn {
            font-size: 24px;
            text-decoration: none;
        }
        /* Тости (сповіщення) */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #00838f;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: bottom 0.3s ease-in-out;
            z-index: 1000;
        }
        body.dark-theme .toast {
            background: #bb86fc;
            color: #121212;
        }
        .toast.show {
            bottom: 30px; 
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>

    <div id="toast" class="toast">Повідомлення</div>

    <main class="settings-container">
        <h1>📝 Реєстрація</h1>
        <form id="registerForm" class="settings-card">
            <input type="text" id="regUser" placeholder="Введіть логін" required>
            <input type="password" id="regPass" placeholder="Введіть пароль" required>
            <button type="submit" id="submitReg">Зареєструватися</button>
        </form>
    </main>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-theme');
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value.trim();

        if (!username || !password) {
            showToast('❌ Заповніть всі поля!');
            return;
        }

        let usersData = JSON.parse(localStorage.getItem('gameUsersData')) || {};

        if (usersData[username]) {
            showToast('❌ Такий користувач вже є!');
            return;
        }

        usersData[username] = { password: password, score: 0 };
        localStorage.setItem('gameUsersData', JSON.stringify(usersData));

        localStorage.setItem('userCounter_' + username, 0);
        localStorage.setItem('totalClicks_' + username, 0);
        localStorage.setItem('clickPower_' + username, 1);
        localStorage.setItem('currentUser', username);
        
        showToast('✨ Реєстрація успішна!');
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1000);
    });
</script>
</body>
</html>
