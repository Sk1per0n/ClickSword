<!DOCTYPE html>
<html lang="uk">
<head>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
    <meta charset="UTF-8">
    <title>Реєстрація - ClickSword</title>
    <link rel="stylesheet" href="style1.css"> <!-- або стиль твоїх форм -->
</head>
<body>
    <header>
        <a href="index.html" class="home-btn">🏠</a>
    </header>

    <main class="settings-container">
        <h1>📝 Реєстрація</h1>
        <form id="registerForm" class="settings-card">
            <input type="text" id="regUser" placeholder="Введіть логін" required style="padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #ccc;">
            <input type="password" id="regPass" placeholder="Введіть пароль" required style="padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #ccc;">
            <button type="submit" id="submitReg" style="padding: 12px 24px; background: cyan; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Зареєструватися</button>
        </form>
    </main>
</body>
</html>
